<h2>Asignar/Modificar Nota para {{ estudiante.first_name }} {{ estudiante.last_name }} en {{ curso.nombre }}</h2>

<form method="post">
    {% csrf_token %}
    <label for="nota">Nota:</label>
    <input type="text" id="nota" name="nota" value="{{ nota.nota }}">
    <button type="submit">Guardar</button>
</form>

{% if error %}
    <p style="color:red;">{{ error }}</p>
{% endif %}
