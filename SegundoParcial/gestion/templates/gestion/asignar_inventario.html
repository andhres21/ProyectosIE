{% extends 'gestion/base.html' %}

{% block title %}Asignar Inventario a Instructores{% endblock %}

{% block content %}
<div class="card shadow-sm mb-4">
    <div class="card-header bg-secondary text-white">
        <h4 class="mb-0">Asignar Inventario a Instructores</h4>
    </div>
    <div class="card-body">
        <form method="POST" onsubmit="return validarAsignacionInventario();">
            {% csrf_token %}
            <div class="form-group">
                <label for="usuario">Instructor:</label>
                {{ form.usuario }}
            </div>
            <div class="form-group">
                <label for="inventario">Artículo del inventario:</label>
                {{ form.inventario }}
            </div>
            <div class="form-group">
                <label for="cantidad_asignada">Cantidad a asignar:</label>
                {{ form.cantidad_asignada }}
            </div>
            <button type="submit" class="btn btn-primary">Asignar Inventario</button>
        </form>
    </div>
</div>

<div class="text-center mt-4">
    <a href="{% url 'inventario' %}" class="btn btn-secondary">Regresar</a>
</div>

<script>
    function validarAsignacionInventario() {
        const cantidad = document.getElementById('id_cantidad_asignada').value;
        if (cantidad <= 0) {
            alert("Por favor, ingrese una cantidad válida para asignar.");
            return false;
        }
        return true;
    }
</script>
{% endblock %}
