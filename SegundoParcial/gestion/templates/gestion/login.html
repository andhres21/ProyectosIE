{% extends 'gestion/base.html' %}

{% block title %}Iniciar Sesión{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-lg" style="width: 400px;">
        <div class="card-header bg-dark text-white text-center">
            <h4 class="mb-0">Iniciar Sesión</h4>
        </div>
        <div class="card-body">
            <form method="post" onsubmit="return validarLogin();">
                {% csrf_token %}
                <div class="form-group">
                    <label for="username" class="font-weight-bold">Usuario:</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                        </div>
                        <input type="text" name="username" id="username" class="form-control" placeholder="Ingrese su usuario" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password" class="font-weight-bold">Contraseña:</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        </div>
                        <input type="password" name="password" id="password" class="form-control" placeholder="Ingrese su contraseña" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block mt-3">Ingresar</button>
            </form>
        </div>
    </div>
</div>

<!-- Enlace a Font Awesome para iconos -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

<script>
    function validarLogin() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        if (!username || !password) {
            alert('Por favor, ingrese su usuario y contraseña.');
            return false;
        }
        return true;
    }
</script>
{% endblock %}
