{% extends 'gestion/base.html' %}

{% block title %}Confirmar Eliminación{% endblock %}

{% block content %}
<div class="card shadow-sm mb-4">
    <div class="card-header bg-danger text-white">
        <h4 class="mb-0">Confirmar Eliminación</h4>
    </div>
    <div class="card-body">
        <p>¿Estás seguro de que deseas eliminar a {{ usuario.username }}?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Eliminar Usuario</button>
            <a href="{% url 'admin_credenciales' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
