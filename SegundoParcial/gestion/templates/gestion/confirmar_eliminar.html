<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Eliminación</title>
</head>
<body>
    <h1>¿Estás seguro que deseas eliminar a {{ usuario.username }}?</h1>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Eliminar Usuario</button>
        <a href="{% url 'admin_credenciales' %}">Cancelar</a>
    </form>
</body>
</html>
