{% extends 'gestion/base.html' %}

{% block title %}Enviar Reporte{% endblock %}

{% block content %}
<div class="d-flex justify-content-center mt-5">
    <div class="card shadow-lg" style="width: 50%;">
        <div class="card-header bg-dark text-white text-center">
            <h4 class="mb-0">Enviar Reporte al Administrador</h4>
        </div>
        <div class="card-body">
            {% if success %}
                <div class="alert alert-success mt-3">Reporte enviado exitosamente.</div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="asunto" class="font-weight-bold">Asunto:</label>
                    <input type="text" name="asunto" id="asunto" class="form-control" placeholder="Ingrese el asunto del reporte" required>
                </div>
                <div class="form-group">
                    <label for="mensaje" class="font-weight-bold">Descripción:</label>
                    <textarea name="mensaje" id="mensaje" class="form-control" rows="4" placeholder="Describa el motivo del reporte" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Enviar Reporte</button>
            </form>
        </div>
    </div>
</div>

<!-- Botón de regreso al panel de administración -->
<div class="text-center mt-4">
    <a href="{% url 'instructor_panel' %}" class="btn btn-secondary">Regresar</a>
</div>

{% endblock %}
