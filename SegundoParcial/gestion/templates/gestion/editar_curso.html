{% extends 'gestion/base.html' %}

{% block title %}Editar Curso{% endblock %}

{% block content %}
<div class="card shadow-sm mb-4">
    <div class="card-header bg-secondary text-white">
        <h4 class="mb-0">Editar Curso</h4>
    </div>
    <div class="card-body">
        <form method="post" onsubmit="return validarFormulario();">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Guardar cambios</button>
        </form>
    </div>
</div>
<script>
    function validarFormulario() {
        const cupoMaximo = document.querySelector('input[name="cupo_maximo"]');
        if (cupoMaximo && cupoMaximo.value <= 0) {
            alert('El cupo máximo debe ser un número positivo.');
            return false;
        }
        return true;
    }
</script>
{% endblock %}
